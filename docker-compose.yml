services:
  db:
    image: postgres:16-alpine
    container_name: ordinace_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordinace_db}
      POSTGRES_USER: ${POSTGRES_USER:-ordinace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordinace_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ordinace_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ordinace_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ordinace_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ordinace_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ordinace_secret}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - ordinace_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ordinace_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ordinace_network

volumes:
  postgres_data:
    driver: local

networks:
  ordinace_network:
    driver: bridge
